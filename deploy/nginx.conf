server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;

    # Self-signed by deploy.sh; Cloudflare connects with SSL mode "Full".
    # Replace with a Cloudflare Origin Certificate for Full (strict).
    ssl_certificate /etc/ssl/certs/semsyilmaz.crt;
    ssl_certificate_key /etc/ssl/private/semsyilmaz.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_name semsyilmaz.com www.semsyilmaz.com;

    root /var/www/semsyilmaz;
    index index.html;

    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # Hashed build assets never change.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /og.png {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location = /favicon.svg {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # About now lives on the home page.
    location = /about {
        return 301 /#about;
    }

    location = /about/ {
        return 301 /#about;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
